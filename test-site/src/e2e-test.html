<!DOCTYPE html>
<html>
  <head>
    <title>VAD E2E Test Page</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <h1>VAD E2E Test Page</h1>
    <p>This page is used for Playwright integration tests</p>

    <!-- Load ONNX Runtime first (required dependency) -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.js"></script>

    <!-- Load VAD bundle (expects ort global) -->
    <script src="bundle.min.js"></script>

    <script>
      // Verify vad is loaded
      if (typeof vad !== 'undefined') {
        console.log('VAD loaded successfully');
        console.log('VAD exports:', Object.keys(vad));
      } else {
        console.error('VAD not loaded');
      }
    </script>
  </body>
</html>
